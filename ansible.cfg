[privilege_escalation]
become_method = sudo
# Ubuntu 26.04 defaults to sudo-rs; become uses the original sudo, which Ubuntu ships as sudo.ws
become_exe = /usr/bin/sudo.ws

[ssh_connection]
# trust a new host's key on first connect, still reject a changed key
ssh_args = -C -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=accept-new
