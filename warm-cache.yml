---
# Pre-download and load all enabled models into the llama-server cache.
# Each model blocks until fully downloaded and loaded — expect hours for large GGUFs.
# Run with: ansible-playbook warm-cache.yml
- name: Warm llama.cpp Model Cache
  hosts: all
  vars_files:
    - vars/main.yml

  tasks:
    - name: Wait for llamacpp Router
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: "{{ llamacpp_port }}"
        timeout: 30

    - name: Download and Load Each Enabled Model
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ llamacpp_port }}/v1/chat/completions"
        method: POST
        body_format: json
        body:
          model: "{{ item.name }}"
          messages:
            - role: user
              content: hi
          max_tokens: 1
        timeout: 7200
      loop: "{{ models | selectattr('enabled') | list }}"
      loop_control:
        label: "{{ item.name }}"
