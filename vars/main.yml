---
service_account: llm
service_account_home: "/home/{{ service_account }}"

# Strix Halo unified memory + TTM
# 128 GiB = 33554432 pages at 4 KiB/page
ttm_pages_limit: 33554432

# llama.cpp ROCm build
llamacpp_rocm_tag: b1258
llamacpp_rocm_url: "https://github.com/lemonade-sdk/llamacpp-rocm/releases/download/{{ llamacpp_rocm_tag }}/llama-{{ llamacpp_rocm_tag }}-ubuntu-rocm-gfx1151-x64.zip"
llamacpp_prefix: /opt/llamacpp-rocm

# llama-swap router
llamaswap_version: "211"
llamaswap_url: "https://github.com/mostlygeek/llama-swap/releases/download/v{{ llamaswap_version }}/llama-swap_{{ llamaswap_version }}_linux_amd64.tar.gz"
llamaswap_prefix: /opt/llamaswap

# llama-swap listens here; individual llama.cpp servers listen on model.port
llamacpp_port: 8080

# Open WebUI
openwebui_version: 0.9.2
openwebui_python_version: "3.11"
openwebui_port: 80
openwebui_data_dir: "{{ service_account_home }}/openwebui"

openwebui_env:
  OPENAI_API_BASE_URLS: "http://127.0.0.1:{{ llamacpp_port }}/v1"
  OPENAI_API_KEYS: dummy
  ENABLE_OPENAI_API: "true"
  ENABLE_OLLAMA_API: "false"
  WEBUI_AUTH: "false"
  ENABLE_TITLE_GENERATION: "false"
  ENABLE_FOLLOW_UP_GENERATION: "false"
  ENABLE_TAGS_GENERATION: "false"
  ENABLE_RETRIEVAL_QUERY_GENERATION: "false"
  ENABLE_IMAGE_PROMPT_GENERATION: "false"
  ENABLE_WEB_SEARCH: "false"
  ENABLE_SEARCH_QUERY_GENERATION: "false"

# Global llama.cpp key=value flags
llamacpp_common:
  n-gpu-layers: 999
  flash-attn: "on"     # accepts on/off/auto, not 1/0
  cache-type-k: q8_0
  cache-type-v: q8_0
  defrag-thold: 0.1
  threads: 32
  threads-batch: 32

# Global llama.cpp boolean (presence-only) flags — no value argument
llamacpp_flags:
  - jinja          # Qwen template support
  - cont-batching  # better throughput
  - no-kv-offload  # keep tensors resident
  - no-mmap        # disable memory-mapped I/O
  - mlock          # pin model in RAM

models:
  - name: reasoning
    port: 8081
    hf-repo: unsloth/Qwen3.6-35B-A3B-GGUF:UD-Q6_K_XL

    # 262K is possible but wastes huge KV memory.
    # 128K is the practical sweet spot.
    ctx_size: 131072

    enabled: true

    aliases: qwen3.6,qwen-reasoning

    sampling:
      temp: 1.0
      top-p: 0.95
      top-k: 20
      min-p: 0.0
      repeat-penalty: 1.02

    extra_args:
      reasoning: "on"

      # YaRN scaling for stable long context
      rope-scaling: yarn
      rope-scale: 4

      # Better reasoning stability
      repeat-last-n: 4096

  - name: coder
    port: 8082
    hf-repo: unsloth/Qwen3.6-35B-A3B-GGUF:UD-Q6_K_XL

    # Coding benefits less from giant contexts
    # unless doing full repo ingestion.
    ctx_size: 65536

    enabled: true

    aliases: qwen-coder,qwen-dev

    sampling:
      # Lower temp for deterministic coding
      temp: 0.2

      top-p: 0.9
      top-k: 20
      min-p: 0.0

      repeat-penalty: 1.05

    extra_args:
      # HUGE latency improvement for coding
      reasoning: "off"

      rope-scaling: yarn
      rope-scale: 2

      repeat-last-n: 2048