---
# SERVICE ACCOUNT
service_account: llm
service_account_home: "/home/{{ service_account }}"

# GPU / ROCM
ttm_pages_limit: 33554432  # 128 GiB = 33554432 pages at 4 KiB/page

# PORTS
openwebui_port: 80
litellm_port: 4000

models:
  - name: qwen-36-reasoning
    env:
      LLAMA_ARG_CTX_SIZE: 262144
      LLAMA_ARG_HF_REPO: unsloth/Qwen3.6-35B-A3B-MTP-GGUF:UD-Q8_K_XL
      LLAMA_ARG_N_GPU_LAYERS: 999
      LLAMA_ARG_PORT: 8080
      LLAMA_ARG_SPEC_DRAFT_N_MAX: 2
      LLAMA_ARG_SPEC_TYPE: draft-mtp
      LLAMA_ARG_THREADS: 32
    command:
      temp: 1.0
      top-p: 0.95
      top-k: 20
      min-p: 0.00