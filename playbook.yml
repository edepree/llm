---
- name: Deploy LLM Stack
  hosts: all
  become: true
  vars:
    # Set via setup.sh prompt; running the playbook directly defaults to the modular stack
    llm_stack_mode: "{{ llm_stack_mode | default('modular') }}"

  pre_tasks:
    - name: Verify target is Ubuntu/Debian
      ansible.builtin.assert:
        that:
          - ansible_facts['os_family'] == 'Debian'
        fail_msg: "This playbook requires Ubuntu or Debian"

  roles:
    - role: common
      tags: [common, system]

    - role: service-account
      tags: [accounts]

    - role: system-hardening
      tags: [hardening, updates]

    - role: rocm
      tags: [rocm, gpu]

    - role: podman-setup
      tags: [podman, infrastructure]
      when: llm_stack_mode != 'standalone-bare-metal'

    - role: inference
      tags: [inference, llamacpp]

    - role: router
      tags: [router, bifrost]
      when: llm_stack_mode == 'modular'

    - role: chat
      tags: [chat, openwebui]
      when: llm_stack_mode == 'modular'
