---
- name: Deploy LLM Stack
  hosts: all
  become: true

  pre_tasks:
    - name: Verify Target is Ubuntu 26.04 x86_64
      ansible.builtin.assert:
        that:
          - ansible_facts['distribution'] == 'Ubuntu'
          - ansible_facts['distribution_version'] == '26.04'
          - ansible_facts['architecture'] == 'x86_64'
        fail_msg: "This playbook requires Ubuntu 26.04 on x86_64"
      tags: [always]

  roles:
    - role: common
      tags: [common]

    - role: inference
      tags: [inference]
