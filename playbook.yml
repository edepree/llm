---
- name: Deploy LLM Stack
  hosts: all
  become: true
  vars:
    # Set via setup.sh prompt; running the playbook directly defaults to the modular stack
    llm_stack_mode: "{{ llm_stack_mode | default('modular') }}"

  pre_tasks:
    - name: Verify target is Ubuntu/Debian
      ansible.builtin.assert:
        that:
          - ansible_facts['os_family'] == 'Debian'
        fail_msg: "This playbook requires Ubuntu or Debian"

  roles:
    - role: common
      tags: [common, system]

    - role: service-account
      tags: [accounts]
      when: svc_account_enabled | default(true)

    - role: system-hardening
      tags: [hardening, updates]
      when: sys_hardening_enable_updates | default(true)

    - role: rocm
      tags: [rocm, gpu]
      when: rocm_enabled | default(true)

    - role: podman-setup
      tags: [podman, infrastructure]

    - role: inference
      tags: [inference, llamacpp]
      when: inference_enabled | default(true)

    - role: router
      tags: [router, bifrost]
      when:
        - router_enabled | default(true)
        - llm_stack_mode | default('modular') != 'standalone'

    - role: chat
      tags: [chat, openwebui]
      when:
        - chat_enabled | default(true)
        - llm_stack_mode | default('modular') != 'standalone'
