---
- name: Deploy LLM Stack
  hosts: all
  become: true
  vars:
    # Set via setup.sh prompt; running the playbook directly defaults to the modular stack
    llm_stack_mode: modular

  pre_tasks:
    - name: Validate Deployment Mode
      ansible.builtin.assert:
        that:
          - llm_stack_mode in ['standalone-bare-metal', 'standalone-podman', 'modular']
        fail_msg: "llm_stack_mode must be standalone-bare-metal, standalone-podman, or modular"
      tags: [always]

    - name: Verify Target is Ubuntu 26.04 x86_64
      ansible.builtin.assert:
        that:
          - ansible_facts['distribution'] == 'Ubuntu'
          - ansible_facts['distribution_version'] == '26.04'
          - ansible_facts['architecture'] == 'x86_64'
        fail_msg: "This playbook requires Ubuntu 26.04 on x86_64"
      tags: [always]

  roles:
    - role: common
      tags: [common, system]

    - role: service-account
      tags: [accounts]

    - role: system-hardening
      tags: [hardening, updates]

    - role: rocm
      tags: [rocm, gpu]

    - role: podman-setup
      tags: [podman, infrastructure]
      when: llm_stack_mode != 'standalone-bare-metal'

    - role: inference
      tags: [inference, llamacpp]

    - role: router
      tags: [router, bifrost]
      when: llm_stack_mode == 'modular'

    - role: chat
      tags: [chat, openwebui]
      when: llm_stack_mode == 'modular'
