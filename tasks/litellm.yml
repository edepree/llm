---
- name: Deploy LiteLLM Configuration
  ansible.builtin.template:
    src: templates/litellm-config.yaml.j2
    dest: "{{ service_account_home }}/.config/litellm/config.yaml"
    owner: "{{ service_account }}"
    group: "{{ service_account }}"
    mode: "0644"

- name: Deploy LiteLLM Quadlet
  become_user: "{{ service_account }}"
  containers.podman.podman_container:
    name: litellm
    image: ghcr.io/berriai/litellm:main
    publish:
      - "{{ litellm.port }}:8080/tcp"
    volume:
      - "{{ service_account_home }}/.config/litellm/config.yaml:/app/config.yaml:ro"
    env:
      LITELLM_LOG: WARNING
      HOST: 0.0.0.0
      PORT: "4000"
    state: quadlet

- name: Start LiteLLM Systemd Unit
  become_user: "{{ service_account }}"
  ansible.builtin.systemd:
    name: container-litellm.service
    daemon_reload: true
    enabled: true
    scope: user
    state: started
