---
- name: Create Bifrost Configuration Directory
  ansible.builtin.file:
    path: "/home/{{ service_account.name }}/.config/bifrost"
    state: directory
    owner: "{{ service_account.name }}"
    group: "{{ service_account.name }}"
    mode: "0755"

- name: Deploy Bifrost Configuration
  ansible.builtin.template:
    src: templates/bifrost-config.json.j2
    dest: "/home/{{ service_account.name }}/.config/bifrost/config.json"
    owner: "{{ service_account.name }}"
    group: "{{ service_account.name }}"
    mode: "0644"

- name: Create Podman network
  become: true
  become_user: "{{ service_account.name }}"
  containers.podman.podman_network:
    name: artificial-intelligence
    state: present

- name: Deploy Bifrost Quadlet
  become: true
  become_user: "{{ service_account.name }}"
  containers.podman.podman_container:
    name: "{{ bifrost.name }}"
    image: docker.io/maximhq/bifrost
    network:
      - artificial-intelligence
    publish:
      - "{{ bifrost.port }}:8080/tcp"
    volume:
      - "/home/{{ service_account.name }}/.config/bifrost/config.json:/app/data/config.json:ro"
      - "{{ bifrost.name }}:/app/data"
    env:
    state: quadlet

- name: Start Bifrost Systemd Unit
  become: true
  become_user: "{{ service_account.name }}"
  ansible.builtin.systemd:
    name: "{{ bifrost.name }}.service"
    daemon_reload: true
    enabled: true
    scope: user
    state: started
