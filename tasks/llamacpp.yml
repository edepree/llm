---
- name: Read Installed Version Stamp
  ansible.builtin.slurp:
    src: "{{ llamacpp_prefix }}/version"
  register: llamacpp_stamp
  ignore_errors: true

- name: Set Install-Required Fact
  ansible.builtin.set_fact:
    llamacpp_install_required: "{{ llamacpp_stamp.failed or (llamacpp_stamp.content | b64decode | trim) != llamacpp_rocm_tag }}"

- name: Download and Install llamacpp-rocm Release
  when: llamacpp_install_required
  block:
    - name: Download Release Archive
      ansible.builtin.get_url:
        url: "{{ llamacpp_rocm_url }}"
        dest: /tmp/llamacpp-rocm.zip
        mode: "0644"

    - name: Ensure Install Directory
      ansible.builtin.file:
        path: "{{ llamacpp_prefix }}"
        state: directory
        mode: "0755"

    - name: Extract Release Archive
      ansible.builtin.unarchive:
        src: /tmp/llamacpp-rocm.zip
        dest: "{{ llamacpp_prefix }}"
        remote_src: true

    - name: Set Execute Bit on llamacpp Binaries
      ansible.builtin.command:
        cmd: find {{ llamacpp_prefix }} -maxdepth 1 -type f -name 'llama-*' -exec chmod 0755 {} +
      changed_when: false

    - name: Write Version Stamp
      ansible.builtin.copy:
        content: "{{ llamacpp_rocm_tag }}"
        dest: "{{ llamacpp_prefix }}/version"
        mode: "0644"
      notify: Restart llamacpp

    - name: Remove Release Archive
      ansible.builtin.file:
        path: /tmp/llamacpp-rocm.zip
        state: absent

- name: Add llamacpp-rocm to Linker Search Path
  ansible.builtin.copy:
    dest: /etc/ld.so.conf.d/llamacpp-rocm.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      {{ llamacpp_prefix }}
  notify: Run ldconfig

- name: Read Installed llama-swap Version Stamp
  ansible.builtin.slurp:
    src: "{{ llamaswap_prefix }}/version"
  register: llamaswap_stamp
  ignore_errors: true

- name: Set llama-swap Install-Required Fact
  ansible.builtin.set_fact:
    llamaswap_install_required: "{{ llamaswap_stamp.failed or (llamaswap_stamp.content | b64decode | trim) != llamaswap_version }}"

- name: Download and Install llama-swap Release
  when: llamaswap_install_required
  block:
    - name: Ensure llama-swap Install Directory
      ansible.builtin.file:
        path: "{{ llamaswap_prefix }}"
        state: directory
        mode: "0755"

    - name: Download llama-swap Archive
      ansible.builtin.get_url:
        url: "{{ llamaswap_url }}"
        dest: /tmp/llamaswap.tar.gz
        mode: "0644"

    - name: Extract llama-swap Archive
      ansible.builtin.unarchive:
        src: /tmp/llamaswap.tar.gz
        dest: "{{ llamaswap_prefix }}"
        remote_src: true

    - name: Set Execute Bit on llama-swap Binary
      ansible.builtin.file:
        path: "{{ llamaswap_prefix }}/llama-swap"
        mode: "0755"

    - name: Write llama-swap Version Stamp
      ansible.builtin.copy:
        content: "{{ llamaswap_version }}"
        dest: "{{ llamaswap_prefix }}/version"
        mode: "0644"
      notify: Restart llamaswap

    - name: Remove llama-swap Archive
      ansible.builtin.file:
        path: /tmp/llamaswap.tar.gz
        state: absent

- name: Deploy llama.cpp Model Services
  environment: "{{ user_systemd_env }}"
  block:
    - name: Ensure llamaswap Config Directory
      ansible.builtin.file:
        path: "{{ service_account_home }}/.config/llamaswap"
        state: directory
        owner: "{{ service_account }}"
        group: "{{ service_account }}"
        mode: "0755"

    - name: Template llama.cpp Model Systemd Units
      ansible.builtin.template:
        src: llamacpp.service.j2
        dest: "{{ service_account_home }}/.config/systemd/user/llamacpp-{{ item.name }}.service"
        owner: "{{ service_account }}"
        group: "{{ service_account }}"
        mode: "0644"
      loop: "{{ models | selectattr('enabled') | list }}"
      vars:
        model: "{{ item }}"
      notify: Restart llamacpp

    - name: Enable llamacpp Model Services
      become_user: "{{ service_account }}"
      ansible.builtin.systemd:
        name: "llamacpp-{{ item.name }}.service"
        scope: user
        enabled: true
        state: started
      loop: "{{ models | selectattr('enabled') | list }}"

    - name: Template llama-swap Config
      ansible.builtin.template:
        src: llamaswap.yaml.j2
        dest: "{{ service_account_home }}/.config/llamaswap/config.yaml"
        owner: "{{ service_account }}"
        group: "{{ service_account }}"
        mode: "0644"
      notify: Restart llamaswap

    - name: Template llama-swap Systemd Unit
      ansible.builtin.template:
        src: llamaswap.service.j2
        dest: "{{ service_account_home }}/.config/systemd/user/llamaswap.service"
        owner: "{{ service_account }}"
        group: "{{ service_account }}"
        mode: "0644"
      notify: Restart llamaswap

    - name: Enable llamaswap Service
      become_user: "{{ service_account }}"
      ansible.builtin.systemd:
        name: llamaswap.service
        scope: user
        enabled: true
        state: started
