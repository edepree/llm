---
- name: Create llama.cpp Quadlet Container
  loop: "{{ llamacpp.models }}"
  loop_control:
    loop_var: model
    label: "llamacpp-{{ model.name }}"
  become_user: "{{ service_account }}"
  containers.podman.podman_container:
    name: "llamacpp-{{ model.name }}"
    image: ghcr.io/ggml-org/llama.cpp:server-rocm
    publish:
      - "{{ model.port }}:{{ model.port }}/tcp"
    volume:
      - "llamacpp-{{ model.name }}:/root/.cache/llama.cpp"
    device:
      - /dev/dri
      - /dev/kfd
    group_add:
      - keep-groups
    env: "{{ model.environment_variables | default({}) }}"
    state: quadlet
    command: >-
      {{
        model.command
        | dict2items
        | map('community.general.json_query', '{k: key, v: value}')
      }}

- name: Start llama.cpp Systemd Units
  become_user: "{{ service_account }}"
  ansible.builtin.systemd:
    name: "container-llamacpp-{{ model.name }}.service"
    daemon_reload: true
    enabled: true
    scope: user
    state: started
  loop: "{{ llamacpp.models }}"
  loop_control:
    loop_var: model
    label: "{{ model.name }}"