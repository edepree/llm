---
- name: Read Installed Version Stamp
  ansible.builtin.slurp:
    src: "{{ llamacpp_prefix }}/version"
  register: llamacpp_stamp
  ignore_errors: true

- name: Set Install-Required Fact
  ansible.builtin.set_fact:
    llamacpp_install_required: "{{ llamacpp_stamp.failed or (llamacpp_stamp.content | b64decode | trim) != llamacpp_rocm_tag }}"

- name: Download and Install llamacpp-rocm Release
  when: llamacpp_install_required
  block:
    - name: Download Release Archive
      ansible.builtin.get_url:
        url: "{{ llamacpp_rocm_url }}"
        dest: /tmp/llamacpp-rocm.zip
        mode: "0644"

    - name: Ensure Install Directory
      ansible.builtin.file:
        path: "{{ llamacpp_prefix }}"
        state: directory
        mode: "0755"

    - name: Extract Release Archive
      ansible.builtin.unarchive:
        src: /tmp/llamacpp-rocm.zip
        dest: "{{ llamacpp_prefix }}"
        remote_src: true

    - name: Set Execute Bit on llamacpp Binaries
      ansible.builtin.command:
        cmd: find {{ llamacpp_prefix }} -maxdepth 1 -type f -name 'llama-*' -exec chmod 0755 {} +

    - name: Write Version Stamp
      ansible.builtin.copy:
        content: "{{ llamacpp_rocm_tag }}"
        dest: "{{ llamacpp_prefix }}/version"
        mode: "0644"
      notify: Restart llamacpp

    - name: Remove Release Archive
      ansible.builtin.file:
        path: /tmp/llamacpp-rocm.zip
        state: absent

- name: Add llamacpp-rocm to Linker Search Path
  ansible.builtin.copy:
    dest: /etc/ld.so.conf.d/llamacpp-rocm.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      {{ llamacpp_prefix }}
  notify: Run ldconfig

- name: Check if llama-swap service exists
  ansible.builtin.stat:
    path: "{{ service_account_home }}/.config/systemd/user/llamaswap.service"
  register: llamaswap_service_exists
  changed_when: false

- name: Stop and Disable llama-swap Service
  become_user: "{{ service_account }}"
  environment: "{{ user_systemd_env }}"
  ansible.builtin.systemd:
    name: llamaswap.service
    scope: user
    enabled: false
    state: stopped
  failed_when: false
  when: llamaswap_service_exists.stat.exists | default(false)

- name: Remove llama-swap Systemd Unit
  ansible.builtin.file:
    path: "{{ service_account_home }}/.config/systemd/user/llamaswap.service"
    state: absent
  when: llamaswap_service_exists.stat.exists | default(false)

- name: Deploy llama.cpp Router
  environment: "{{ user_systemd_env }}"
  vars:
    enabled_models: "{{ models | selectattr('enabled') | list }}"
    models_with_autoload: "{{ enabled_models | rejectattr('autoload', 'equalto', false) | list }}"
  block:
    - name: Template llama.cpp Router Presets
      ansible.builtin.template:
        src: llamacpp-presets.ini.j2
        dest: "{{ service_account_home }}/.config/llamacpp/presets.ini"
        owner: "{{ service_account }}"
        group: "{{ service_account }}"
        mode: "0644"
      notify: Restart llamacpp

    - name: Template llama.cpp Router Systemd Unit
      ansible.builtin.template:
        src: llamacpp.service.j2
        dest: "{{ service_account_home }}/.config/systemd/user/llamacpp.service"
        owner: "{{ service_account }}"
        group: "{{ service_account }}"
        mode: "0644"
      notify: Restart llamacpp

    - name: Enable llamacpp Service
      become_user: "{{ service_account }}"
      ansible.builtin.systemd:
        name: llamacpp.service
        scope: user
        daemon_reload: true
        enabled: true
        state: started
