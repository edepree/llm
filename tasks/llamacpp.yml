---
- name: Read Installed Version Stamp
  ansible.builtin.slurp:
    src: /usr/local/share/llamacpp/version
  register: llamacpp_stamp
  ignore_errors: true

- name: Set Install-Required Fact
  ansible.builtin.set_fact:
    llamacpp_install_required: "{{ llamacpp_stamp.failed or (llamacpp_stamp.content | b64decode | trim) != llamacpp_rocm_tag }}"

- name: Download and Install llamacpp-rocm Release
  when: llamacpp_install_required
  block:
    - name: Ensure Staging Directory
      ansible.builtin.file:
        path: /tmp/llamacpp-rocm-staging
        state: directory
        mode: "0755"

    - name: Install unzip
      ansible.builtin.apt:
        name: unzip
        state: present

    - name: Download Release Archive
      ansible.builtin.get_url:
        url: "{{ llamacpp_rocm_url }}"
        dest: /tmp/llamacpp-rocm.zip
        mode: "0644"

    - name: Extract Release Archive
      ansible.builtin.unarchive:
        src: /tmp/llamacpp-rocm.zip
        dest: /tmp/llamacpp-rocm-staging
        remote_src: true

    - name: Find llamacpp Binaries
      ansible.builtin.find:
        paths: /tmp/llamacpp-rocm-staging
        patterns: "llama-*"
        recurse: true
        file_type: file
      register: llamacpp_binaries

    - name: Install llamacpp Binaries
      ansible.builtin.copy:
        src: "{{ item.path }}"
        dest: "{{ llamacpp_prefix }}/bin/{{ item.path | basename }}"
        mode: "0755"
        remote_src: true
      loop: "{{ llamacpp_binaries.files }}"
      notify: Restart llamacpp

    - name: Ensure Stamp Directory
      ansible.builtin.file:
        path: /usr/local/share/llamacpp
        state: directory
        mode: "0755"

    - name: Write Version Stamp
      ansible.builtin.copy:
        content: "{{ llamacpp_rocm_tag }}"
        dest: /usr/local/share/llamacpp/version
        mode: "0644"

- name: Deploy llama.cpp Router
  become_user: "{{ service_account }}"
  environment: "{{ user_systemd_env }}"
  block:
    - name: Template llama.cpp Router Presets
      ansible.builtin.template:
        src: llamacpp-presets.ini.j2
        dest: "{{ service_account_home }}/.config/llamacpp/presets.ini"
        mode: "0644"
      notify: Restart llamacpp

    - name: Template llama.cpp Router Systemd Unit
      ansible.builtin.template:
        src: llamacpp.service.j2
        dest: "{{ service_account_home }}/.config/systemd/user/llamacpp.service"
        mode: "0644"
      notify: Restart llamacpp

    - name: Enable llamacpp Service
      ansible.builtin.systemd:
        name: llamacpp.service
        scope: user
        daemon_reload: true
        enabled: true
        state: started
