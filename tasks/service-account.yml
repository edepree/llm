---
- name: Create service account
  ansible.builtin.user:
    name: "{{ service_account }}"
    shell: /bin/bash
    groups: render,video
    append: true

- name: Enable lingering for service account
  ansible.builtin.command: loginctl enable-linger {{ service_account }}
  args:
    creates: /var/lib/systemd/linger/{{ service_account }}

- name: Export UID and systemd environment variables
  ansible.builtin.set_fact:
    service_account_uid: "{{ ansible_facts.getent_passwd[service_account][2] }}"
    user_systemd_env:
      XDG_RUNTIME_DIR: "/run/user/{{ service_account_uid }}"
      DBUS_SESSION_BUS_ADDRESS: "unix:path=/run/user/{{ service_account_uid }}/bus"

- name: Wait for user systemd manager socket
  ansible.builtin.wait_for:
    path: "/run/user/{{ service_account_uid }}/systemd/private"
    timeout: 30

- name: Create user config directories
  ansible.builtin.file:
    path: "{{ service_account_home }}/{{ item }}"
    state: directory
    owner: "{{ service_account }}"
    group: "{{ service_account }}"
    mode: "0755"
  loop:
    - .config
    - .config/environment.d
    - .config/litellm
    - .config/systemd
    - .config/systemd/user
    - .config/containers/systemd
    - .config/llamacpp
    - .local/share/containers
    - .local/share/containers/storage

- name: Set XDG_RUNTIME_DIR in environment-d
  ansible.builtin.copy:
    dest: "{{ service_account_home }}/.config/environment.d/10-xdg-runtime.conf"
    owner: "{{ service_account }}"
    group: "{{ service_account }}"
    mode: "0644"
    content: |
      XDG_RUNTIME_DIR=/run/user/{{ service_account_uid }}

- name: Set DefaultLimitMEMLOCK in user systemd config
  ansible.builtin.copy:
    dest: "{{ service_account_home }}/.config/systemd/user.conf"
    owner: "{{ service_account }}"
    group: "{{ service_account }}"
    mode: "0644"
    content: |
      DefaultLimitMEMLOCK=infinity
