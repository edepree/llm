---
# Strix Halo GPU tuning.
# - ttm.pages_limit controls how much system RAM the iGPU can pin as GTT.
#   It's set via the kernel command line (most reliable on Strix Halo where
#   ttm loads early in boot) with a modprobe.d fallback.
# - amd_iommu=off avoids a known perf/stability hit on integrated RDNA 3.5.
# - tuned's accelerator-performance profile pins cpufreq high during compute.

- name: Set ttm Module Options (modprobe.d Fallback)
  ansible.builtin.copy:
    dest: /etc/modprobe.d/ttm.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      options ttm pages_limit={{ ttm_pages_limit }} page_pool_size={{ ttm_pages_limit }}

- name: Set Kernel Command Line for Strix Halo GPU Tuning
  ansible.builtin.copy:
    dest: /etc/default/grub.d/99-strix-halo.cfg
    owner: root
    group: root
    mode: "0644"
    content: |
      GRUB_CMDLINE_LINUX_DEFAULT="${GRUB_CMDLINE_LINUX_DEFAULT} amd_iommu=off ttm.pages_limit={{ ttm_pages_limit }} ttm.page_pool_size={{ ttm_pages_limit }}"
  notify: Update Grub
  register: grub_cmdline

- name: Flag Reboot Required When Kernel Command Line Changed
  ansible.builtin.file:
    path: /var/run/reboot-required
    state: touch
    owner: root
    group: root
    mode: "0644"
  when: grub_cmdline.changed

- name: Install tuned for cpufreq Management
  ansible.builtin.apt:
    name: tuned
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Enable tuned
  ansible.builtin.systemd:
    name: tuned
    enabled: true
    state: started

- name: Get Active tuned Profile
  ansible.builtin.command: tuned-adm active
  register: tuned_active
  changed_when: false

- name: Activate accelerator-performance tuned Profile
  ansible.builtin.command: tuned-adm profile accelerator-performance
  when: "'accelerator-performance' not in tuned_active.stdout"

- name: Allow Unprivileged Services to Bind Ports >= 80
  ansible.posix.sysctl:
    name: net.ipv4.ip_unprivileged_port_start
    value: "80"
    state: present
    sysctl_set: true
    reload: true
    sysctl_file: /etc/sysctl.d/99-unprivileged-ports.conf
