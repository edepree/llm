---
- name: Install ROCm Tools
  ansible.builtin.apt:
    name:
      - rocm-smi
    state: present
    update_cache: false

- name: Set ttm Module Options (modprobe.d Fallback)
  ansible.builtin.copy:
    dest: /etc/modprobe.d/ttm.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      options ttm pages_limit={{ ttm_pages_limit }} page_pool_size={{ ttm_pages_limit }}

- name: Enable tuned
  ansible.builtin.systemd:
    name: tuned
    enabled: true
    state: started

- name: Get Active tuned Profile
  ansible.builtin.stat:
    path: /etc/tuned/active_profile
  register: tuned_active_link
  changed_when: false

- name: Activate accelerator-performance tuned Profile
  ansible.builtin.command: tuned-adm profile accelerator-performance
  when: tuned_active_link.stat.islnk is defined and tuned_active_link.stat.lnk_target | basename != "accelerator-performance"

- name: Allow Unprivileged Services to Bind Ports >= 80
  ansible.posix.sysctl:
    name: net.ipv4.ip_unprivileged_port_start
    value: "80"
    state: present
    sysctl_set: true
    reload: true
    sysctl_file: /etc/sysctl.d/99-unprivileged-ports.conf
