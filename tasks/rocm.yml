---
# Install ROCm 7.1 from Ubuntu 26.04's universe archive.
# - The `rocm` meta pulls runtime + hip-sdk; we add the dev libs and
#   hipcc separately to build llama.cpp against them.
# - Debian-style lib*-dev names (differ from AMD upstream package names).
# - Verification is non-fatal pre-reboot (kernel cmdline flag may not yet be live).

- name: Install ROCm 7.1 Runtime and Dev Libraries
  ansible.builtin.apt:
    name:
      - rocm
      - rocminfo
      - rocm-smi
      - hipcc
      - librocblas-dev
      - libhipblas-dev
      - libamdhip64-dev
      - libhsa-runtime-dev
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Ensure ROCm Libraries in Linker Search Path
  ansible.builtin.copy:
    dest: /etc/ld.so.conf.d/rocm.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      /opt/rocm/lib
      /opt/rocm/lib64
  notify: Run ldconfig

- name: Verify gfx1151 is Detected by rocminfo
  ansible.builtin.command: rocminfo
  register: rocminfo_output
  changed_when: false
  failed_when: false

- name: Warn if gfx1151 Not Detected (Reboot May Be Required)
  ansible.builtin.debug:
    msg: >-
      rocminfo did not report gfx1151. This is expected if the kernel command
      line changed and the host has not rebooted yet. After reboot, re-run
      `rocminfo | grep gfx1151` to confirm the iGPU is available.
  when: "'gfx1151' not in rocminfo_output.stdout"
