---
- name: Update and Upgrade Operating System
  ansible.builtin.apt:
    autoclean: true
    autoremove: true
    update_cache: true
    upgrade: safe

- name: Install Packages
  ansible.builtin.apt:
    name: "{{ common_packages }}"
    state: present

- name: Set Minimum Unprivileged Port
  ansible.posix.sysctl:
    name: net.ipv4.ip_unprivileged_port_start
    value: 80
    state: present
    sysctl_set: true
    reload: true
    sysctl_file: /etc/sysctl.d/99-unprivileged-ports.conf

- name: Ensure journald.conf.d Directory
  ansible.builtin.file:
    path: /etc/systemd/journald.conf.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Limit journald On-Disk Usage
  ansible.builtin.copy:
    dest: /etc/systemd/journald.conf.d/99-size-limits.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      [Journal]
      SystemMaxUse={{ common_journald_maxuse }}
  notify: Restart Journald

- name: Configure Base Firewall Rules
  community.general.ufw:
    rule: allow
    port: "22"
    proto: tcp

- name: Configure and Enable Firewall Defaults
  community.general.ufw:
    default: deny
    direction: incoming
    state: enabled
