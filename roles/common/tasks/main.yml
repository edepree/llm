---
- name: Install Packages
  ansible.builtin.apt:
    name: "{{ common_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Enable Tuned Service
  ansible.builtin.service:
    name: tuned
    state: started
    enabled: true

- name: Read Active Tuned Profile
  ansible.builtin.command: tuned-adm active
  register: common_tuned_active
  changed_when: false

- name: Set Tuned Profile
  ansible.builtin.command: tuned-adm profile {{ common_tuned_profile }}
  when: common_tuned_active.stdout.split(':')[-1] | trim != common_tuned_profile
  changed_when: true

- name: Ensure journald.conf.d Directory
  ansible.builtin.file:
    path: /etc/systemd/journald.conf.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Limit journald On-Disk Usage
  ansible.builtin.copy:
    dest: /etc/systemd/journald.conf.d/99-size-limits.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      [Journal]
      SystemMaxUse={{ common_journald_maxuse }}
  notify: Restart Journald

# ROCm is in the llama-server image; the host needs only the kernel driver and the TTM limit
- name: Set TTM Pages Limit
  ansible.builtin.copy:
    dest: /etc/modprobe.d/ttm.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      options ttm pages_limit={{ common_ttm_pages_limit }}
  notify: TTM Changed

# the apt timers read these files on each run, so no restart is needed
- name: Configure APT Periodic Updates
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    owner: root
    group: root
    mode: "0644"
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Download-Upgradeable-Packages "1";
      APT::Periodic::AutocleanInterval "7";
      APT::Periodic::Unattended-Upgrade "1";

- name: Configure Unattended-Upgrades
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/50unattended-upgrades
    owner: root
    group: root
    mode: "0644"
    content: |
      Unattended-Upgrade::Origins-Pattern {
          "origin=Ubuntu,archive=${distro_codename}-security,label=Ubuntu";
      };

      Unattended-Upgrade::Remove-Unused-Kernel-Packages "true";
      Unattended-Upgrade::Remove-New-Unused-Dependencies "true";
      Unattended-Upgrade::Remove-Unused-Dependencies "true";

      Unattended-Upgrade::Automatic-Reboot "{{ common_unattended_reboot | lower }}";
      Unattended-Upgrade::Automatic-Reboot-WithUsers "true";
      Unattended-Upgrade::Automatic-Reboot-Time "03:00";

- name: Allow SSH
  community.general.ufw:
    rule: allow
    port: "22"
    proto: tcp

- name: Enable Firewall with Default Deny
  community.general.ufw:
    default: deny
    direction: incoming
    state: enabled

# rebuild the initramfs now: queued handlers are lost if a later task fails
- name: Apply Pending Handlers
  ansible.builtin.meta: flush_handlers
