---
- name: Update and Upgrade Operating System
  ansible.builtin.apt:
    autoclean: true
    autoremove: true
    update_cache: true
    upgrade: safe

- name: Install Packages
  ansible.builtin.apt:
    name:
      - acl
      - podman
      - ufw
    state: present

- name: Set Minimum Unprivileged Port
  ansible.posix.sysctl:
    name: net.ipv4.ip_unprivileged_port_start
    value: 80
    state: present
    sysctl_set: true
    reload: true
    sysctl_file: /etc/sysctl.d/99-unprivileged-ports.conf

- name: Ensure journald.conf.d Directory
  ansible.builtin.file:
    path: /etc/systemd/journald.conf.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Limit journald On-Disk Usage
  ansible.builtin.copy:
    dest: /etc/systemd/journald.conf.d/99-size-limits.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      [Journal]
      SystemMaxUse=1G
