---
- name: Restart Journald
  ansible.builtin.systemd_service:
    name: systemd-journald
    state: restarted
    scope: system

# amdgpu and ttm load from the initramfs, so the option applies only after a rebuild and a reboot
- name: Rebuild Initramfs
  ansible.builtin.command: update-initramfs -u
  changed_when: true
  listen: TTM Changed

# kernel command line comes from grub.cfg, so regenerate it after a grub.d file changes
- name: Update GRUB
  ansible.builtin.command: update-grub
  changed_when: true
  listen: Kernel Cmdline Changed

- name: Reboot Notice
  ansible.builtin.debug:
    msg: "TTM pages_limit or kernel command line changed: reboot the host for it to take effect"
  listen:
    - TTM Changed
    - Kernel Cmdline Changed
