---
common_packages:
  - acl
  - curl # multipart uploads in the STT checks
  - libxrt-utils-npu # xrt-smi: NPU status and firmware version
  - nvtop # GPU load and memory
  - podman
  - systemd-container # provides machinectl and journalctl -M
  - tuned
  - ufw
  - unattended-upgrades

# the containers bundle XRT and ROCm user space, which must match the host driver and firmware.
# Only the installed ones are held; at least one kernel metapackage must be installed
common_held_packages:
  - linux-firmware
  - linux-generic
  - linux-generic-hwe-26.04
  - linux-oem-26.04

common_tuned_profile: throughput-performance

common_journald_maxuse: 1G

# GPU-addressable system memory, in 4 KiB pages
common_ttm_pages_limit: 26214400

common_unattended_reboot: false
