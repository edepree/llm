---
common_packages:
  - acl
  - libxrt-utils-npu # xrt-smi for NPU status and firmware version
  - nethogs # per-process network traffic, e.g. model downloads
  - nvtop
  - podman
  - systemd-container # machinectl and journalctl -M
  - tuned
  - ufw
  - unattended-upgrades

# held with linux-firmware because the containers bundle XRT and ROCm user space that must match the host driver and firmware
common_kernel_packages:
  - linux-generic
  - linux-generic-hwe-26.04
  - linux-oem-26.04

common_tuned_profile: throughput-performance

common_journald_maxuse: 1G

# GPU-addressable system memory in 4 KiB pages
common_ttm_pages_limit: 29360128 # 112 GiB

common_unattended_reboot: false
