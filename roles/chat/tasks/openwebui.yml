---
- name: Create Podman Network
  become: true
  become_user: "{{ common_service_account.name }}"
  containers.podman.podman_network:
    name: artificial-intelligence
    state: present

- name: Deploy Quadlet for Chat Container
  become: true
  become_user: "{{ common_service_account.name }}"
  containers.podman.podman_container:
    name: "{{ chat_openwebui.name }}"
    image: ghcr.io/open-webui/open-webui:latest
    network:
      - artificial-intelligence
    publish:
      - "{{ chat_openwebui.port }}:8080/tcp"
    volume:
      - "{{ chat_openwebui.name }}:/app/backend/data"
    env: "{{ chat_openwebui.environment_variables | default({}) }}"
    state: quadlet

- name: Start Systemd Unit for Chat Container
  become: true
  become_user: "{{ common_service_account.name }}"
  ansible.builtin.systemd:
    name: "{{ chat_openwebui.name }}"
    daemon_reload: true
    enabled: true
    scope: user
    state: started
