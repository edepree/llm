---
- name: Create Podman network
  become: true
  become_user: "{{ service_account.name }}"
  containers.podman.podman_network:
    name: artificial-intelligence
    state: present

- name: Deploy OpenWebUI Quadlet
  become: true
  become_user: "{{ service_account.name }}"
  containers.podman.podman_container:
    name: openwebui
    image: ghcr.io/open-webui/open-webui:latest
    network:
      - artificial-intelligence
    publish:
      - "{{ chat_openwebui.port }}:8080/tcp"
    volume:
      - "openwebui:/app/backend/data"
    env: "{{ chat_openwebui.environment_variables | default({}) }}"
    state: quadlet

- name: Start OpenWebUI Systemd Unit
  become: true
  become_user: "{{ service_account.name }}"
  ansible.builtin.systemd:
    name: openwebui.service
    daemon_reload: true
    enabled: true
    scope: user
    state: started
