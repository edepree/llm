---
# amdgpu and ttm load from the initramfs, so the option applies only after a rebuild and a reboot
- name: Rebuild Initramfs
  ansible.builtin.command: update-initramfs -u
  changed_when: true
  listen: TTM Changed

- name: Reboot Notice
  ansible.builtin.debug:
    msg: "TTM pages_limit changed: reboot the host for it to take effect"
  listen: TTM Changed
