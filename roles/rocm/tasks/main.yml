---
# ROCm is in the llama-server image; the host needs only the kernel driver and the TTM limit
- name: Set TTM Pages Limits
  ansible.builtin.copy:
    dest: /etc/modprobe.d/ttm.conf
    content: |
      options ttm pages_limit={{ rocm_ttm_pages_limit }}
    mode: "0644"
  notify: TTM Changed

# rebuild the initramfs now: queued handlers are lost if a later task fails
- name: Apply TTM Change
  ansible.builtin.meta: flush_handlers
