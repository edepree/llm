---
- name: Create Service Account
  ansible.builtin.user:
    name: "{{ svc_account_name }}"
    shell: /bin/bash
    groups: "{{ svc_account_groups | join(',') }}"
    append: true

- name: Enable Lingering for Service Account
  ansible.builtin.command: loginctl enable-linger {{ svc_account_name }}
  args:
    creates: /var/lib/systemd/linger/{{ svc_account_name }}
