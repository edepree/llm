---
- name: Restart STT
  become: true
  become_user: "{{ service_account_user }}"
  ansible.builtin.systemd_service:
    name: flm-asr.service
    scope: user
    daemon_reload: true
    state: restarted

# the user manager reads limits at start; restarting it restarts every service of the account
- name: Restart User Manager
  ansible.builtin.systemd_service:
    name: user@{{ service_account_uid }}.service
    scope: system
    state: restarted
