---
router_port: 80
router_wyoming_port: 10300
router_webui_port: 3000
router_bifrost_image: docker.io/maximhq/bifrost:v2.3.2
router_wyoming_image: ghcr.io/roryeckel/wyoming_openai:0.8.0
router_webui_image: ghcr.io/open-webui/open-webui:v0.12.3
# seconds, including time queued behind another request (FLM handles one at a time).
# FLM runs at ~0.13x real time, but Bifrost's 100 MB body limit caps a 44.1 kHz stereo WAV at ~9 min first
router_stt_timeout: 300
# seconds for a non-streaming chat; covers a cold load of a large model plus a long answer
router_chat_timeout: 900
# dashboard login only; the API needs no key. Generated on the controller on first run
router_admin_password: "{{ lookup('ansible.builtin.password', 'credentials/bifrost-admin chars=ascii_letters,digits length=24') }}"
