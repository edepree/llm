---
- name: Create Bifrost Config Directory
  ansible.builtin.file:
    path: "{{ service_account_home }}/.config/bifrost"
    state: directory
    owner: "{{ service_account_user }}"
    group: "{{ service_account_user }}"
    mode: "0755"

- name: Deploy Bifrost Configuration
  ansible.builtin.template:
    src: bifrost-config.json.j2
    dest: "{{ service_account_home }}/.config/bifrost/config.json"
    owner: "{{ service_account_user }}"
    group: "{{ service_account_user }}"
    mode: "0644"
  notify: Restart Bifrost

# config.db and logs.db live in the volume, and config.json is applied over them at every start
- name: Deploy Quadlet for Bifrost
  become: true
  become_user: "{{ service_account_user }}"
  containers.podman.podman_container:
    name: bifrost
    image: "{{ router_bifrost_image }}"
    network:
      - llm.network
    volume:
      - bifrost-data:/app/data
      - "{{ service_account_home }}/.config/bifrost/config.json:/app/data/config.json:ro"
    env:
      BIFROST_ADMIN_PASSWORD: "{{ router_admin_password }}"
    state: quadlet
    quadlet_options:
      - |
        [Unit]
        Wants=llamacpp-server.service flm-asr.service kokoro-tts.service
        After=llamacpp-server.service flm-asr.service kokoro-tts.service
      - "{{ service_account_quadlet_options }}"
  no_log: true # The env holds the admin password
  notify: Restart Bifrost

- name: Apply Pending Restarts
  ansible.builtin.meta: flush_handlers

- name: Start Bifrost
  become: true
  become_user: "{{ service_account_user }}"
  ansible.builtin.systemd_service:
    name: bifrost.service
    scope: user
    daemon_reload: true
    state: started

- name: Wait for Router
  become: true
  become_user: "{{ service_account_user }}"
  ansible.builtin.command:
    argv:
      - podman
      - run
      - --rm
      - --network
      - llm
      - "{{ service_account_curl_image }}"
      - -sf
      - http://bifrost:8080/v1/models
  register: router_models
  changed_when: false
  until: >-
    router_models.rc == 0
    and (router_models.stdout | from_json).data | selectattr('id', 'match', 'llamacpp/') | list | length > 0
    and (router_models.stdout | from_json).data | selectattr('id', 'match', 'flm/') | list | length == 0
  retries: 30
  delay: 10

- name: Verify STT via Router
  become: true
  become_user: "{{ service_account_user }}"
  ansible.builtin.command:
    argv:
      - podman
      - run
      - --rm
      - --network
      - llm
      - -v
      - "{{ service_account_home }}/build/flm/short.wav:/short.wav:ro"
      - "{{ service_account_curl_image }}"
      - -sf
      - http://bifrost:8080/v1/audio/transcriptions
      - -F
      - file=@/short.wav
      - -F
      - model=flm/whisper-v3
      # The fields Home Assistant's OpenAI integration adds
      - -F
      - language=en
      - -F
      - response_format=json
      - -F
      - prompt=Home Assistant voice command
  register: router_stt
  changed_when: false
  failed_when: "'fellow Americans' not in router_stt.stdout"

# Bifrost labels every speech response audio/mpeg whatever the format, so check the size of the audio instead
- name: Verify TTS via Router
  become: true
  become_user: "{{ service_account_user }}"
  ansible.builtin.command:
    argv:
      - podman
      - run
      - --rm
      - --network
      - llm
      - "{{ service_account_curl_image }}"
      - -sf
      - -o
      - /dev/null
      - -w
      - "%{size_download}"
      - http://bifrost:8080/v1/audio/speech
      - -H
      - "Content-Type: application/json"
      - -d
      - '{"model": "kokoro/kokoro", "input": "The lights are off.", "voice": "alloy", "response_format": "mp3"}'
  register: router_tts
  changed_when: false
  failed_when: router_tts.rc != 0 or router_tts.stdout | int < 10000
