---
# Rootless podman binds the host port as the service account
- name: Allow Unprivileged Bind to Router Ports
  ansible.posix.sysctl:
    name: net.ipv4.ip_unprivileged_port_start
    value: "{{ [router_port, router_webui_port] | min }}"
    sysctl_file: /etc/sysctl.d/99-unprivileged-ports.conf
  when: ([router_port, router_webui_port] | min) < 1024

- name: Create Bifrost Config Directory
  ansible.builtin.file:
    path: "{{ service_account_home }}/.config/bifrost"
    state: directory
    owner: "{{ service_account_user }}"
    group: "{{ service_account_user }}"
    mode: "0755"

- name: Deploy Bifrost Configuration
  ansible.builtin.template:
    src: bifrost-config.json.j2
    dest: "{{ service_account_home }}/.config/bifrost/config.json"
    owner: "{{ service_account_user }}"
    group: "{{ service_account_user }}"
    mode: "0644"
  notify: Restart Bifrost

# config.db and logs.db live in the volume, and config.json is applied over them at every start
- name: Deploy Quadlet for Bifrost
  become: true
  become_user: "{{ service_account_user }}"
  containers.podman.podman_container:
    name: bifrost
    image: "{{ router_bifrost_image }}"
    network:
      - llm.network
    publish:
      - "{{ router_port }}:8080/tcp"
    volume:
      - bifrost-data:/app/data
      - "{{ service_account_home }}/.config/bifrost/config.json:/app/data/config.json:ro"
    env:
      BIFROST_ADMIN_PASSWORD: "{{ router_admin_password }}"
    state: quadlet
    quadlet_options:
      - |
        [Unit]
        Wants=llamacpp-server.service flm-asr.service kokoro-tts.service
        After=llamacpp-server.service flm-asr.service kokoro-tts.service
      - "{{ service_account_quadlet_options }}"
  no_log: true # The env holds the admin password
  notify: Restart Bifrost

# Open WebUI stores OPENAI_* and ENABLE_OLLAMA_API in its database on first start, so later changes go through its admin settings
- name: Deploy Quadlet for Open WebUI
  become: true
  become_user: "{{ service_account_user }}"
  containers.podman.podman_container:
    name: open-webui
    image: "{{ router_webui_image }}"
    network:
      - llm.network
    publish:
      - "{{ router_webui_port }}:8080/tcp"
    volume:
      - open-webui-data:/app/backend/data
    env:
      OPENAI_API_BASE_URL: http://bifrost:8080/v1
      OPENAI_API_KEY: none
      ENABLE_OLLAMA_API: "False"
      WEBUI_AUTH: "False" # Single shared user, enabling auth later requires wiping open-webui-data
    state: quadlet
    quadlet_options:
      - |
        [Unit]
        Wants=bifrost.service
        After=bifrost.service
      - "{{ service_account_quadlet_options }}"
  notify: Restart Open WebUI

- name: Allow Router Ports
  community.general.ufw:
    rule: allow
    port: "{{ item | string }}"
    proto: tcp
  loop:
    - "{{ router_port }}"
    - "{{ router_webui_port }}"

- name: Apply Pending Restarts
  ansible.builtin.meta: flush_handlers

- name: Start Router Services
  become: true
  become_user: "{{ service_account_user }}"
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    scope: user
    daemon_reload: true
    state: started
  loop:
    - bifrost.service
    - open-webui.service

- name: Wait for Router
  ansible.builtin.uri:
    url: http://127.0.0.1:{{ router_port }}/v1/models
  register: router_models
  until: >-
    router_models.status == 200
    and router_models.json.data | selectattr('id', 'match', 'llamacpp/') | list | length > 0
    and router_models.json.data | selectattr('id', 'match', 'flm/') | list | length == 0
  retries: 30
  delay: 10

- name: Verify STT via Router
  ansible.builtin.command:
    argv:
      - curl
      - -sf
      - http://127.0.0.1:{{ router_port }}/v1/audio/transcriptions
      - -F
      - file=@{{ service_account_home }}/build/flm/short.wav
      - -F
      - model=flm/whisper-v3
      # The fields Home Assistant's OpenAI integration adds
      - -F
      - language=en
      - -F
      - response_format=json
      - -F
      - prompt=Home Assistant voice command
  register: router_stt
  changed_when: false
  failed_when: "'fellow Americans' not in router_stt.stdout"

# Bifrost labels every speech response audio/mpeg whatever the format, so check the size of the audio instead
- name: Verify TTS via Router
  ansible.builtin.command:
    argv:
      - curl
      - -sf
      - -o
      - /dev/null
      - -w
      - "%{size_download}"
      - http://127.0.0.1:{{ router_port }}/v1/audio/speech
      - -H
      - "Content-Type: application/json"
      - -d
      - '{"model": "kokoro/kokoro", "input": "The lights are off.", "voice": "alloy", "response_format": "mp3"}'
  register: router_tts
  changed_when: false
  failed_when: router_tts.rc != 0 or router_tts.stdout | int < 10000

# The first start downloads its embedding model, so allow a few minutes
- name: Wait for Open WebUI
  ansible.builtin.uri:
    url: http://127.0.0.1:{{ router_webui_port }}/health
  register: router_webui
  until: router_webui.status == 200
  retries: 30
  delay: 10
