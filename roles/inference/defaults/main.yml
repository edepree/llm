---
inference_server:
  name: llamacpp-server
  port: 80
  # llama.cpp git tag built into the image; bump to upgrade, set back to roll back
  llama_ref: v0.5.0
  rocm_version: "10.0"
  gpu_target: gfx1151
  models_max: 1
  cache_path: /models
  # [*] section of the preset file; flag values must be quoted strings ("true"), not YAML booleans
  global_settings:
    flash-attn: "on"
    n-gpu-layers: 999
    load-mode: none # no mmap: much faster model loads on unified memory
    threads: 32
  presets:
    - section: unsloth/gpt-oss-20b-GGUF:F16
      settings:
        c: 131072
        hf-repo: unsloth/gpt-oss-20b-GGUF:F16
        min-p: 0.00
        temp: 1.0
        top-k: 0
        top-p: 1.0
    - section: unsloth/gpt-oss-120b-GGUF:F16
      settings:
        c: 131072
        hf-repo: unsloth/gpt-oss-120b-GGUF:F16
        min-p: 0.00
        temp: 1.0
        top-k: 0
        top-p: 1.0
    - section: unsloth/Qwen3.6-35B-A3B-MTP-GGUF:UD-Q8_K_XL
      settings:
        c: 262144
        hf-repo: unsloth/Qwen3.6-35B-A3B-MTP-GGUF:UD-Q8_K_XL
        min-p: 0.00
        spec-draft-n-max: 2
        spec-type: draft-mtp
        temp: 0.6
        top-k: 20
        top-p: 0.95
    - section: unsloth/Qwen3.8-27B-GGUF:UD-Q8_K_XL
      settings:
        c: 262144
        hf-repo: unsloth/Qwen3.8-27B-GGUF:UD-Q8_K_XL
        min-p: 0.00
        reasoning-preserve: "true"
        spec-default: "true"
        spec-draft-n-max: 2
        spec-type: draft-mtp
        temp: 1.0
        top-k: 20
        top-p: 0.95
    - section: unsloth/Qwen3.8-Flash-Next-GGUF:UD-Q4_K_XL
      settings:
        c: 262144
        hf-repo: unsloth/Qwen3.8-Flash-Next-GGUF:UD-Q4_K_XL
        min-p: 0.00
        presence-penalty: 0.0
        reasoning-preserve: "true"
        spec-default: "true"
        spec-draft-n-max: 2
        spec-type: draft-mtp
        temp: 1.0
        top-k: 20
        top-p: 0.95
