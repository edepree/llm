---
inference_user: llm
inference_port: 80
# llama.cpp release tag to build; change it to upgrade or roll back
inference_llama_ref: v0.5.0
inference_models_max: 1
# ROCm 10.0 and gfx1151 are set in files/Containerfile; update this tag if you change them
inference_image: "localhost/llama-server:{{ inference_llama_ref }}-rocm10.0"

# one section per model; "*" applies to all of them
inference_presets:
  "*":
    flash-attn: "on"
    n-gpu-layers: 999
    load-mode: none # read the model into memory instead of using mmap
    threads: 32
