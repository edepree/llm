---
# standalone mode: single llama.cpp server with model presets
- name: Create Configuration Directory for Standalone llama.cpp
  ansible.builtin.file:
    path: "/home/{{ common_service_account.name }}/.config/llamacpp"
    state: directory
    owner: "{{ common_service_account.name }}"
    group: "{{ common_service_account.name }}"
    mode: "0755"
  when: llm_stack_mode == 'standalone'

- name: Deploy Model Preset Configuration for Standalone llama.cpp
  ansible.builtin.template:
    src: templates/models-preset.ini.j2
    dest: "/home/{{ common_service_account.name }}/.config/llamacpp/models-preset.ini"
    owner: "{{ common_service_account.name }}"
    group: "{{ common_service_account.name }}"
    mode: "0644"
  when: llm_stack_mode == 'standalone'
  notify: Restart Standalone Inference Container

- name: Deploy Quadlet for Standalone llama.cpp Container
  become: true
  become_user: "{{ common_service_account.name }}"
  containers.podman.podman_container:
    name: "{{ inference_standalone.name }}"
    image: ghcr.io/ggml-org/llama.cpp:server-rocm
    network:
      - artificial-intelligence
    publish:
      - "{{ inference_standalone.port }}:8080/tcp"
    volume:
      - "{{ inference_standalone.name }}:{{ inference_standalone.cache_path }}"
      - "/home/{{ common_service_account.name }}/.config/llamacpp/models-preset.ini:/models-preset.ini:ro"
    device:
      - /dev/dri
      - /dev/kfd
    group_add:
      - keep-groups
    state: quadlet
    command: --models-preset /models-preset.ini --models-max {{ inference_standalone.models_max }}
    quadlet_options:
      - |
        [Install]
        WantedBy=default.target
  when: llm_stack_mode == 'standalone'
  notify: Restart Standalone Inference Container

- name: Configure Standalone Inference Firewall Rules
  community.general.ufw:
    rule: allow
    port: "{{ inference_standalone.port | string }}"
    proto: tcp
  when: llm_stack_mode == 'standalone'

# modular mode: one llama.cpp container per model, fronted by the model router
- name: Deploy Quadlet for Inference Container
  become: true
  become_user: "{{ common_service_account.name }}"
  loop: "{{ inference_llamacpp.models }}"
  loop_control:
    loop_var: model
    label: "{{ model.name }}"
  containers.podman.podman_container:
    name: "{{ model.name }}"
    image: ghcr.io/ggml-org/llama.cpp:server-rocm
    network:
      - artificial-intelligence
    publish:
      - "{{ model.port }}:8080/tcp"
    volume:
      - "{{ model.name }}:{{ inference_llamacpp.cache_path }}"
    device:
      - /dev/dri
      - /dev/kfd
    group_add:
      - keep-groups
    env: "{{ model.environment_variables | default({}) }}"
    state: quadlet
    command: "{{ model.command }}"
    quadlet_options:
      - |
        [Install]
        WantedBy=default.target
  when: llm_stack_mode != 'standalone'
  notify: Restart Inference Container

- name: Configure Inference Container Firewall Rules
  community.general.ufw:
    rule: allow
    port: "{{ item.port | string }}"
    proto: tcp
  loop: "{{ inference_llamacpp.models }}"
  when: llm_stack_mode != 'standalone'
