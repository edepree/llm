---
# standalone mode: single llama.cpp server with model presets (bare metal or podman)
- name: Create Configuration Directory for Standalone llama.cpp
  ansible.builtin.file:
    path: "/home/{{ common_service_account.name }}/.config/llamacpp"
    state: directory
    owner: "{{ common_service_account.name }}"
    group: "{{ common_service_account.name }}"
    mode: "0755"
  when: llm_stack_mode in ['standalone-bare-metal', 'standalone-podman']

- name: Deploy Model Preset Configuration for Standalone llama.cpp
  ansible.builtin.template:
    src: templates/models-preset.ini.j2
    dest: "/home/{{ common_service_account.name }}/.config/llamacpp/models-preset.ini"
    owner: "{{ common_service_account.name }}"
    group: "{{ common_service_account.name }}"
    mode: "0644"
  when: llm_stack_mode in ['standalone-bare-metal', 'standalone-podman']
  notify: "{{ inference_standalone_restart_handler }}"

# standalone bare metal: llama.cpp built from source, installed system-wide
- name: Install Build Dependencies
  become: true
  ansible.builtin.apt:
    name:
      - build-essential
      - clang
      - cmake
      - curl
      - git
      - libcurl4-openssl-dev
      - lld
      - ninja-build
      - pkg-config
      - python3
    state: present
    update_cache: true
  when: llm_stack_mode == 'standalone-bare-metal'

- name: Install ROCm Development Packages
  become: true
  ansible.builtin.apt:
    name: "{{ inference_standalone.rocm_dev_packages }}"
    state: present
  when: llm_stack_mode == 'standalone-bare-metal'

- name: Create llama.cpp Source Directory
  become: true
  ansible.builtin.file:
    path: "{{ inference_standalone.build_dir | dirname }}"
    state: directory
    mode: "0755"
  when: llm_stack_mode == 'standalone-bare-metal'

- name: Fetch llama.cpp Source
  become: true
  ansible.builtin.git:
    repo: "{{ inference_standalone.source_repo }}"
    dest: "{{ inference_standalone.build_dir }}"
    version: "{{ inference_standalone.source_ref }}"
    update: true
    force: true
  register: llamacpp_source_fetch
  notify: "{{ inference_standalone_restart_handler }}"
  when: llm_stack_mode == 'standalone-bare-metal'

- name: Check Installed llama-server Binary
  become: true
  ansible.builtin.stat:
    path: "{{ inference_standalone.install_bin_dir }}/llama-server"
  register: llamacpp_installed_binary
  when: llm_stack_mode == 'standalone-bare-metal'

- name: Build and Install llama.cpp from Source
  become: true
  environment:
    ROCM_PATH: "{{ inference_standalone.rocm_path }}"
    HIP_PATH: "{{ inference_standalone.rocm_path }}"
    HIP_PLATFORM: amd
    HIP_CLANG_PATH: "{{ inference_standalone.rocm_path }}/lib/llvm/bin"
    PATH: >-
      {{ inference_standalone.rocm_path }}/bin:{{ inference_standalone.rocm_path }}/lib/llvm/bin:{{
      ansible_facts['ansible_env']['PATH'] }}
  when:
    - llm_stack_mode == 'standalone-bare-metal'
    - llamacpp_source_fetch.changed or not llamacpp_installed_binary.stat.exists
  block:
    # ROCm's own clang (found via hipconfig) is the only compiler that can see the
    # amdgcn device library; the distro clang++ configured fine but failed the HIP test.
    - name: Clean llama.cpp Build Directory
      ansible.builtin.file:
        path: "{{ inference_standalone.build_dir }}/build"
        state: absent

    - name: Configure llama.cpp Build
      ansible.builtin.shell: |
        HIPCXX="$(hipconfig -l)/clang" HIP_PATH="$(hipconfig -R)" cmake -S . -B build -G Ninja \
          -DCMAKE_BUILD_TYPE=Release \
          -DGGML_HIP=ON \
          -DGPU_TARGETS={{ inference_standalone.gpu_target }} \
          -DGGML_HIP_ROCWMMA_FATTN=ON \
          -DGGML_HIP_NO_VMM=ON \
          -DGGML_HIP_MMQ_MFMA=ON
      args:
        chdir: "{{ inference_standalone.build_dir }}"

    - name: Compile llama.cpp
      ansible.builtin.command: |
        cmake --build build -j {{ inference_standalone.build_jobs }}
      args:
        chdir: "{{ inference_standalone.build_dir }}"

    - name: Install llama.cpp Binaries
      ansible.builtin.copy:
        remote_src: true
        src: "{{ inference_standalone.build_dir }}/build/bin/{{ item }}"
        dest: "{{ inference_standalone.install_bin_dir }}/{{ item }}"
        mode: "0755"
      loop:
        - llama-cli
        - llama-server

    - name: Create llama.cpp Library Directory
      ansible.builtin.file:
        path: "{{ inference_standalone.install_lib_dir }}"
        state: directory
        mode: "0755"

    - name: Find llama.cpp Shared Libraries
      ansible.builtin.find:
        paths: "{{ inference_standalone.build_dir }}/build/bin"
        patterns: "*.so*"
      register: llamacpp_shared_libs

    - name: Install llama.cpp Shared Libraries
      ansible.builtin.copy:
        remote_src: true
        src: "{{ item.path }}"
        dest: "{{ inference_standalone.install_lib_dir }}/{{ item.path | basename }}"
        mode: "0755"
      loop: "{{ llamacpp_shared_libs.files }}"
      loop_control:
        label: "{{ item.path | basename }}"

    - name: Deploy llama.cpp Dynamic Linker Configuration
      ansible.builtin.template:
        src: templates/llamacpp-ld.so.conf.j2
        dest: /etc/ld.so.conf.d/llamacpp.conf
        mode: "0644"

    - name: Refresh Shared Library Cache
      ansible.builtin.command: ldconfig
      notify: "{{ inference_standalone_restart_handler }}"

- name: Create Systemd User Unit Directory for Standalone llama.cpp
  ansible.builtin.file:
    path: "/home/{{ common_service_account.name }}/.config/systemd/user"
    state: directory
    owner: "{{ common_service_account.name }}"
    group: "{{ common_service_account.name }}"
    mode: "0755"
  when: llm_stack_mode == 'standalone-bare-metal'

- name: Deploy Systemd User Service for Standalone llama.cpp
  ansible.builtin.template:
    src: templates/llamacpp-server.service.j2
    dest: "/home/{{ common_service_account.name }}/.config/systemd/user/{{ inference_standalone.name }}.service"
    owner: "{{ common_service_account.name }}"
    group: "{{ common_service_account.name }}"
    mode: "0644"
  when: llm_stack_mode == 'standalone-bare-metal'
  notify: Restart Standalone Inference Bare Metal

- name: Enable and Start Standalone llama.cpp Service
  become: true
  become_user: "{{ common_service_account.name }}"
  ansible.builtin.systemd:
    name: "{{ inference_standalone.name }}.service"
    scope: user
    daemon_reload: true
    enabled: true
    state: started
  when: llm_stack_mode == 'standalone-bare-metal'

# standalone podman: single server container
- name: Deploy Quadlet for Standalone llama.cpp Container
  become: true
  become_user: "{{ common_service_account.name }}"
  containers.podman.podman_container:
    name: "{{ inference_standalone.name }}"
    image: ghcr.io/ggml-org/llama.cpp:server-rocm
    network:
      - artificial-intelligence
    publish:
      - "{{ inference_standalone.port }}:8080/tcp"
    volume:
      - "{{ inference_standalone.name }}:{{ inference_standalone.cache_path }}"
      - "/home/{{ common_service_account.name }}/.config/llamacpp/models-preset.ini:/models-preset.ini:ro"
    device:
      - /dev/dri
      - /dev/kfd
    env:
      LLAMA_CACHE: "{{ inference_standalone.cache_path }}"
    group_add:
      - keep-groups
    state: quadlet
    command: --models-preset /models-preset.ini --models-max {{ inference_standalone.models_max }}
    quadlet_options:
      - |
        [Install]
        WantedBy=default.target
  when: llm_stack_mode == 'standalone-podman'
  notify: Restart Standalone Inference Container

- name: Configure Standalone Inference Firewall Rules
  community.general.ufw:
    rule: allow
    port: "{{ inference_standalone.port | string }}"
    proto: tcp
  when: llm_stack_mode in ['standalone-bare-metal', 'standalone-podman']

# modular mode: one llama.cpp container per model, fronted by the model router
- name: Deploy Quadlet for Inference Container
  become: true
  become_user: "{{ common_service_account.name }}"
  loop: "{{ inference_llamacpp.models }}"
  loop_control:
    loop_var: model
    label: "{{ model.name }}"
  containers.podman.podman_container:
    name: "{{ model.name }}"
    image: ghcr.io/ggml-org/llama.cpp:server-rocm
    network:
      - artificial-intelligence
    publish:
      - "{{ model.port }}:8080/tcp"
    volume:
      - "{{ model.name }}:{{ inference_llamacpp.cache_path }}"
    device:
      - /dev/dri
      - /dev/kfd
    group_add:
      - keep-groups
    env: "{{ model.environment_variables | default({}) | combine({'LLAMA_CACHE': inference_llamacpp.cache_path}) }}"
    state: quadlet
    command: "{{ model.command }}"
    quadlet_options:
      - |
        [Install]
        WantedBy=default.target
  when: llm_stack_mode == 'modular'
  notify: Restart Inference Container

- name: Configure Inference Container Firewall Rules
  community.general.ufw:
    rule: allow
    port: "{{ item.port | string }}"
    proto: tcp
  loop: "{{ inference_llamacpp.models }}"
  when: llm_stack_mode == 'modular'
