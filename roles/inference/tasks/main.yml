---
# standalone mode: single llama.cpp server with model presets (bare metal or podman)
- name: Create Configuration Directory for Standalone llama.cpp
  ansible.builtin.file:
    path: "/home/{{ common_service_account.name }}/.config/llamacpp"
    state: directory
    owner: "{{ common_service_account.name }}"
    group: "{{ common_service_account.name }}"
    mode: "0755"
  when: llm_stack_mode in ['standalone-bare-metal', 'standalone-podman']

- name: Deploy Model Preset Configuration for Standalone llama.cpp
  ansible.builtin.template:
    src: templates/models-preset.ini.j2
    dest: "/home/{{ common_service_account.name }}/.config/llamacpp/models-preset.ini"
    owner: "{{ common_service_account.name }}"
    group: "{{ common_service_account.name }}"
    mode: "0644"
  when: llm_stack_mode in ['standalone-bare-metal', 'standalone-podman']
  notify: "{{ inference_standalone_restart_handler }}"

# standalone bare metal: vendor-installed llama binary running as a systemd user service
- name: Install Curl for llama.cpp Vendor Installer
  ansible.builtin.apt:
    name: curl
    state: present
  when: llm_stack_mode == 'standalone-bare-metal'

- name: Install llama.cpp via Vendor Installer
  ansible.builtin.shell: |
    set -o pipefail
    curl -LsSf {{ inference_standalone.install_url }} | sh
  args:
    creates: "/home/{{ common_service_account.name }}/.local/bin/llama"
  become: true
  become_user: "{{ common_service_account.name }}"
  when: llm_stack_mode == 'standalone-bare-metal'

- name: Check Installed llama.cpp Version
  ansible.builtin.command: "/home/{{ common_service_account.name }}/.local/bin/llama version"
  become: true
  become_user: "{{ common_service_account.name }}"
  register: llama_installed_version
  changed_when: false
  failed_when: false
  when: llm_stack_mode == 'standalone-bare-metal'

- name: Check Latest llama.cpp Release
  ansible.builtin.uri:
    url: "{{ inference_standalone.install_repo_url }}/latest"
  register: llama_latest_release
  failed_when: llama_latest_release.status != 200
  when: llm_stack_mode == 'standalone-bare-metal'

- name: Reinstall llama.cpp (binary missing or failing)
  ansible.builtin.shell: |
    set -o pipefail
    curl -LsSf {{ inference_standalone.install_url }} | sh
  become: true
  become_user: "{{ common_service_account.name }}"
  when:
    - llm_stack_mode == 'standalone-bare-metal'
    - llama_installed_version.rc != 0
  notify: "{{ inference_standalone_restart_handler }}"

- name: Update llama.cpp
  ansible.builtin.command: "/home/{{ common_service_account.name }}/.local/bin/llama update"
  become: true
  become_user: "{{ common_service_account.name }}"
  when:
    - llm_stack_mode == 'standalone-bare-metal'
    - llama_installed_version.rc == 0
    - llama_latest_release.content | trim | regex_replace('^b', '') not in llama_installed_version.stdout
  notify: "{{ inference_standalone_restart_handler }}"

- name: Deploy Systemd User Service for Standalone llama.cpp
  ansible.builtin.template:
    src: templates/llamacpp-server.service.j2
    dest: "/home/{{ common_service_account.name }}/.config/systemd/user/{{ inference_standalone.name }}.service"
    owner: "{{ common_service_account.name }}"
    group: "{{ common_service_account.name }}"
    mode: "0644"
  when: llm_stack_mode == 'standalone-bare-metal'
  notify: Restart Standalone Inference Bare Metal

- name: Enable and Start Standalone llama.cpp Service
  become: true
  become_user: "{{ common_service_account.name }}"
  ansible.builtin.systemd:
    name: "{{ inference_standalone.name }}.service"
    scope: user
    daemon_reload: true
    enabled: true
    state: started
  when: llm_stack_mode == 'standalone-bare-metal'

# standalone podman: single server container
- name: Deploy Quadlet for Standalone llama.cpp Container
  become: true
  become_user: "{{ common_service_account.name }}"
  containers.podman.podman_container:
    name: "{{ inference_standalone.name }}"
    image: ghcr.io/ggml-org/llama.cpp:server-rocm
    network:
      - artificial-intelligence
    publish:
      - "{{ inference_standalone.port }}:8080/tcp"
    volume:
      - "{{ inference_standalone.name }}:{{ inference_standalone.cache_path }}"
      - "/home/{{ common_service_account.name }}/.config/llamacpp/models-preset.ini:/models-preset.ini:ro"
    device:
      - /dev/dri
      - /dev/kfd
    env:
      LLAMA_CACHE: "{{ inference_standalone.cache_path }}"
    group_add:
      - keep-groups
    state: quadlet
    command: --models-preset /models-preset.ini --models-max {{ inference_standalone.models_max }}
    quadlet_options:
      - |
        [Install]
        WantedBy=default.target
  when: llm_stack_mode == 'standalone-podman'
  notify: Restart Standalone Inference Container

- name: Configure Standalone Inference Firewall Rules
  community.general.ufw:
    rule: allow
    port: "{{ inference_standalone.port | string }}"
    proto: tcp
  when: llm_stack_mode in ['standalone-bare-metal', 'standalone-podman']

# modular mode: one llama.cpp container per model, fronted by the model router
- name: Deploy Quadlet for Inference Container
  become: true
  become_user: "{{ common_service_account.name }}"
  loop: "{{ inference_llamacpp.models }}"
  loop_control:
    loop_var: model
    label: "{{ model.name }}"
  containers.podman.podman_container:
    name: "{{ model.name }}"
    image: ghcr.io/ggml-org/llama.cpp:server-rocm
    network:
      - artificial-intelligence
    publish:
      - "{{ model.port }}:8080/tcp"
    volume:
      - "{{ model.name }}:{{ inference_llamacpp.cache_path }}"
    device:
      - /dev/dri
      - /dev/kfd
    group_add:
      - keep-groups
    env: "{{ model.environment_variables | default({}) | combine({'LLAMA_CACHE': inference_llamacpp.cache_path}) }}"
    state: quadlet
    command: "{{ model.command }}"
    quadlet_options:
      - |
        [Install]
        WantedBy=default.target
  when: llm_stack_mode == 'modular'
  notify: Restart Inference Container

- name: Configure Inference Container Firewall Rules
  community.general.ufw:
    rule: allow
    port: "{{ item.port | string }}"
    proto: tcp
  loop: "{{ inference_llamacpp.models }}"
  when: llm_stack_mode == 'modular'
