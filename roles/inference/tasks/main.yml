---
- name: Create Inference Directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ service_account_user }}"
    group: "{{ service_account_user }}"
    mode: "0755"
  loop:
    - "{{ service_account_home }}/build/llama-server"
    - "{{ service_account_home }}/.config/llamacpp"

- name: Copy Containerfile
  ansible.builtin.copy:
    src: Containerfile
    dest: "{{ service_account_home }}/build/llama-server/Containerfile"
    owner: "{{ service_account_user }}"
    group: "{{ service_account_user }}"
    mode: "0644"

- name: Deploy Model Preset Configuration
  ansible.builtin.template:
    src: models-preset.ini.j2
    dest: "{{ service_account_home }}/.config/llamacpp/models-preset.ini"
    owner: "{{ service_account_user }}"
    group: "{{ service_account_user }}"
    mode: "0644"
  notify: Restart Inference

# builds when the tag is missing or the Containerfile changed; a build takes 20-40 minutes
- name: Build llama-server Image
  become: true
  become_user: "{{ service_account_user }}"
  containers.podman.podman_image:
    name: "{{ inference_image }}"
    path: "{{ service_account_home }}/build/llama-server"
    build:
      extra_args: --build-arg LLAMA_REF={{ inference_llama_ref }}
    state: present
  async: 3600 # the build continues if the SSH connection drops
  poll: 30
  notify: Restart Inference

# /health returns 200 without a GPU because no model loads at startup, so check the device here
- name: Verify GPU Is Visible in Container
  become: true
  become_user: "{{ service_account_user }}"
  ansible.builtin.command: >-
    podman run --rm --device /dev/kfd --device /dev/dri --group-add keep-groups
    {{ inference_image }} --list-devices
  register: inference_devices
  changed_when: false
  failed_when: "'ROCm0' not in inference_devices.stdout"

- name: Deploy Quadlet for llama-server
  become: true
  become_user: "{{ service_account_user }}"
  containers.podman.podman_container:
    name: llamacpp-server
    image: "{{ inference_image }}"
    publish:
      - 127.0.0.1:8080:8080/tcp # Bifrost is the LAN entry point
    network:
      - llm.network
    volume:
      - llamacpp-models:/models
      - "{{ service_account_home }}/.config/llamacpp/models-preset.ini:/models-preset.ini:ro"
    device:
      - /dev/dri
      - /dev/kfd
    group_add:
      - keep-groups
    env:
      LLAMA_CACHE: /models
    command: >-
      --models-preset /models-preset.ini --models-max {{ inference_models_max }}
      --host 0.0.0.0 --port 8080
    # probes the router process only; model children run on their own ports and are not checked
    healthcheck: curl -sf -m 10 http://127.0.0.1:8080/health
    healthcheck_interval: 30s
    healthcheck_timeout: 15s
    healthcheck_retries: 3
    healthcheck_failure_action: kill # the container exits, then Restart=on-failure starts it again
    state: quadlet
    quadlet_options:
      - |
        [Service]
        Restart=on-failure
        RestartSec=10

        [Install]
        WantedBy=default.target
  notify: Restart Inference

- name: Apply Pending Restarts
  ansible.builtin.meta: flush_handlers

# starts the service if it is stopped; no change after a handler restart.
# no enabled: Quadlet units are generated, [Install] WantedBy starts them at boot
- name: Start llama-server
  become: true
  become_user: "{{ service_account_user }}"
  ansible.builtin.systemd_service:
    name: llamacpp-server.service
    scope: user
    daemon_reload: true
    state: started

- name: Wait for llama-server Health
  ansible.builtin.uri:
    url: http://127.0.0.1:8080/health
  register: inference_health
  until: inference_health.status == 200
  retries: 30
  delay: 10
