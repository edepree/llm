---
- name: Look Up Service Account
  ansible.builtin.getent:
    database: passwd
    key: "{{ common_service_account.name }}"

- name: Create Inference Directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ common_service_account.name }}"
    group: "{{ common_service_account.name }}"
    mode: "0755"
  loop:
    - "{{ inference_home }}/build/llama-server"
    - "{{ inference_home }}/.config/llamacpp"

- name: Copy Containerfile
  ansible.builtin.copy:
    src: Containerfile
    dest: "{{ inference_home }}/build/llama-server/Containerfile"
    owner: "{{ common_service_account.name }}"
    group: "{{ common_service_account.name }}"
    mode: "0644"

- name: Deploy Model Preset Configuration
  ansible.builtin.template:
    src: models-preset.ini.j2
    dest: "{{ inference_home }}/.config/llamacpp/models-preset.ini"
    owner: "{{ common_service_account.name }}"
    group: "{{ common_service_account.name }}"
    mode: "0644"
  notify: Restart Inference

# builds only when this tag is missing (first run or llama_ref bump); takes 20-40 minutes
- name: Build llama-server Image
  become: true
  become_user: "{{ common_service_account.name }}"
  containers.podman.podman_image:
    name: localhost/llama-server
    tag: "{{ inference_image_tag }}"
    path: "{{ inference_home }}/build/llama-server"
    build:
      file: "{{ inference_home }}/build/llama-server/Containerfile"
      extra_args: --build-arg LLAMA_REF={{ inference_server.llama_ref }}
    force: false
    state: present
  async: 3600 # keep a dropped SSH session from killing the build
  poll: 30
  notify: Restart Inference

# /health passes without a GPU (no model loads at startup), so check device passthrough explicitly
- name: Verify GPU Is Visible in Container
  become: true
  become_user: "{{ common_service_account.name }}"
  ansible.builtin.command: >-
    podman run --rm --device /dev/kfd --device /dev/dri --group-add keep-groups
    {{ inference_image }} --list-devices
  register: inference_devices
  changed_when: false
  failed_when: "'ROCm0' not in inference_devices.stdout"

- name: Deploy Quadlet for llama-server
  become: true
  become_user: "{{ common_service_account.name }}"
  containers.podman.podman_container:
    name: "{{ inference_server.name }}"
    image: "{{ inference_image }}"
    publish:
      - "{{ inference_server.port }}:8080/tcp"
    volume:
      - "llamacpp-models:{{ inference_server.cache_path }}"
      - "{{ inference_home }}/.config/llamacpp/models-preset.ini:/models-preset.ini:ro"
    device:
      - /dev/dri
      - /dev/kfd
    group_add:
      - keep-groups
    env:
      LLAMA_CACHE: "{{ inference_server.cache_path }}"
    command: >-
      --models-preset /models-preset.ini --models-max {{ inference_server.models_max }}
      --host 0.0.0.0 --port 8080
    state: quadlet
    quadlet_options:
      - |
        [Service]
        Restart=on-failure
        RestartSec=10

        [Install]
        WantedBy=default.target
  notify: Restart Inference

- name: Configure Inference Firewall Rules
  community.general.ufw:
    rule: allow
    port: "{{ inference_server.port | string }}"
    proto: tcp

- name: Apply Pending Restarts
  ansible.builtin.meta: flush_handlers

# no-op after a handler restart; starts the service if it was stopped
- name: Enable and Start llama-server
  become: true
  become_user: "{{ common_service_account.name }}"
  ansible.builtin.systemd:
    name: "{{ inference_server.name }}.service"
    scope: user
    daemon_reload: true
    enabled: true
    state: started

- name: Wait for llama-server Health
  ansible.builtin.uri:
    url: "http://localhost:{{ inference_server.port }}/health"
    status_code: 200
  register: inference_health
  until: inference_health.status == 200
  retries: 30
  delay: 10
