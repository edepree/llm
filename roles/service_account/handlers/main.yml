---
# The user manager reads limits only at start. Stopping user-runtime-dir@ also stops user@ and clears
# /run/user/<uid>, since a bare user@ restart leaves rootless podman pointing at its killed pause process
- name: Stop User Manager and Runtime Directory
  ansible.builtin.systemd_service:
    name: user-runtime-dir@{{ service_account_uid }}.service
    scope: system
    state: stopped
  listen: Restart User Manager

- name: Start User Manager
  ansible.builtin.systemd_service:
    name: user@{{ service_account_uid }}.service
    scope: system
    state: started
  listen: Restart User Manager
