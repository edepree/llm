---
- name: Create Service Account
  ansible.builtin.user:
    name: "{{ service_account_user }}"
    shell: /bin/bash
    groups: [render, video]
    append: true
  register: service_account_result

- name: Record Service Account Home and UID
  ansible.builtin.set_fact:
    service_account_home: "{{ service_account_result.home }}"
    service_account_uid: "{{ service_account_result.uid }}"

# Rootless containers cannot raise memlock above the account's limit
- name: Allow Unlimited Locked Memory for the NPU
  ansible.builtin.copy:
    dest: /etc/security/limits.d/90-{{ service_account_user }}-memlock.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      {{ service_account_user }} - memlock unlimited
  notify: Restart User Manager

# Before any service starts because the restart stops every service of the account
- name: Apply Memlock Limit
  ansible.builtin.meta: flush_handlers

- name: Enable Lingering for Service Account
  ansible.builtin.command: loginctl enable-linger {{ service_account_user }}
  args:
    creates: /var/lib/systemd/linger/{{ service_account_user }}

# All services join this network and reach each other by container name
- name: Deploy Quadlet for llm Network
  become: true
  become_user: "{{ service_account_user }}"
  containers.podman.podman_network:
    name: llm
    state: quadlet

- name: Start llm Network
  become: true
  become_user: "{{ service_account_user }}"
  ansible.builtin.systemd_service:
    name: llm-network.service
    scope: user
    daemon_reload: true
    state: started
